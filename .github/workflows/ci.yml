name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-os:
    name: test (${{ matrix.os }})
    # Both OSes report, so a Windows-only break is visible without
    # hiding the Linux result behind it.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run interpreter tests
        run: npm test

  # Branch protection requires a check named `test`; the matrix jobs
  # publish per-OS names, so this job carries the stable name and
  # fails if either OS failed or was cancelled.
  test:
    needs: test-os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require both OS jobs to pass
        if: needs.test-os.result != 'success'
        run: |
          echo "test-os result: ${{ needs.test-os.result }}"
          exit 1
